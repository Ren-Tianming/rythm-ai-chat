name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rythm_test
          POSTGRES_USER: rythm
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rythm -d rythm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rythm:test-password@127.0.0.1:5432/rythm_test
      OCR_LANGUAGES: eng
      DATABASE_URL: postgresql+asyncpg://rythm:test-password@127.0.0.1:5432/rythm_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn tesseract-ocr-chi-sim
      - run: pip install -e '.[dev]'
      - run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: ../scripts/test-browser.sh
      - run: ../scripts/test-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          retention-days: 7
          path: frontend/test-results/


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
