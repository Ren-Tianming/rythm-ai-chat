upstream rythm_chatbot {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.rhythmusic.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships Nginx 1.24; use the pre-1.25 compatible HTTP/2 syntax.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.rhythmusic.site;

    ssl_certificate /etc/letsencrypt/live/chat.rhythmusic.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.rhythmusic.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 52m;
    client_body_timeout 60s;

    location / {
        proxy_pass http://rythm_chatbot;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
